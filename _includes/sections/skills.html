<section class="section section--alt" id="skills">
  <div class="container">
    <div class="section-header">
      <span class="section-label">02</span>
      <h2 class="section-title">Навыки</h2>
    </div>

    <ul class="skills-icons">
      {% for skill in site.data.skills %}
      <li class="skill-icon-item">
        <div class="skill-icon-wrap" style="--skill-color: {{ skill.color }}">
          {% include skill-icon.html icon=skill.icon %}
        </div>
        <span class="skill-icon-label">{{ skill.name }}</span>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
